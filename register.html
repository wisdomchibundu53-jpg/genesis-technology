<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Genesis Technology Computer Training</title>

    <!-- Main Website CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Registration Page CSS -->
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <div class="logo">
                <span>GENESIS</span>
                <small>TECHNOLOGY COMPUTER TRAINING</small>
            </div>

            <ul class="nav-links">
                <li>
                    <a href="index.html">Back to Home</a>
                </li>
            </ul>

        </nav>
    </header>


    <!-- Registration Section -->
    <main class="register-page">

        <div class="register-title">

            <p>JOIN GENESIS TECHNOLOGY</p>

            <h1>Online Registration</h1>

            <p>
                Fill in the form below to register for your
                preferred computer training course.
            </p>

        </div>


        <!-- Registration Form -->
        <form class="registration-form" id="registrationForm">

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label for="age"> Age</label>

            <select id="age" name="age" required>
                <option value="" disabled selected>Select your age</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value="21">21</option>
                <option value="22">22</option>
                <option value="23">23</option>
                <option value="24">24</option>
                <option value="25">25</option>
                <option value="26">26</option>
                <option value="27">27</option>
                <option value="28">28</option>
                <option value="29">29</option>
                <option value="30">30</option>
                <option value="31">31</option>
                <option value="32">32</option>
                <option value="33">33</option>
                <option value="34">34</option>
                <option value="35">35</option>
                <option value="36">36</option>
                <option value="37">37</option>
                <option value="38">38</option>
                <option value="39">39</option>
                <option value="40">40</option>
</select>


            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >


            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
            >


            <label for="course">Select Course</label>

            <select id="course" name="course" required>

                <option value="" disabled selected>
                    Choose a course
                </option>

                <option value="computer-basics">
                    Computer Basics
                </option>

                <option value="microsoft-word">
                    Microsoft Word
                </option>

                <option value="microsoft-excel">
                    Microsoft Excel
                </option>

                <option value="powerpoint">
                    Microsoft PowerPoint
                </option>

                <option value="graphic-design">
                    Graphic Design
                </option>

                <option value="web-design">
                    Web Design
                </option>

                <option value="video-editing">
                    Video Editing
                </option>

                <option value="Robotics">
                    Robotics
                </option>

            </select>


            <label for="date">
                Preferred Start Date
            </label>

            <input
                type="date"
                id="date"
                name="date"
            >


            <label for="location"> Address / Location </label>

            <textarea
                id="location"
                name="location"
                placeholder="Enter your address or location"
            ></textarea>


            <button type="submit">
                Submit Registration
            </button>
        </form>    
</div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Genesis Technology Computer Training.
            All Rights Reserved.
        </p>

    </footer>

    <script src="index.js"></script>

</body>

</html>
